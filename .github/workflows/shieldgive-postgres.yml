name: ShieldGive PostgreSQL Persistence

on:
  push:
    branches:
      - "feat/postgres-persistence-stage2"
  workflow_dispatch:

jobs:
  postgres-persistence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shieldgive_test
          POSTGRES_USER: shieldgive
          POSTGRES_PASSWORD: shieldgive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shieldgive -d shieldgive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://shieldgive:shieldgive@127.0.0.1:5432/shieldgive_test
      DB_POOL_MAX: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:storage-postgres
