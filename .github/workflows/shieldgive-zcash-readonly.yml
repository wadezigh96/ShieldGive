name: ShieldGive Zcash Read-Only Smoke

on:
  workflow_dispatch:

jobs:
  zcash-readonly:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ZCASH_RPC_URL: ${{ secrets.ZCASH_RPC_URL }}
      ZCASH_RPC_USER: ${{ secrets.ZCASH_RPC_USER }}
      ZCASH_RPC_PASSWORD: ${{ secrets.ZCASH_RPC_PASSWORD }}
      CAMPAIGN_SHIELDED_ADDRESS: ${{ secrets.CAMPAIGN_SHIELDED_ADDRESS }}
      ZCASH_TEST_TXID: ${{ secrets.ZCASH_TEST_TXID }}
      ZCASH_TEST_MEMO: ${{ secrets.ZCASH_TEST_MEMO }}
      ZCASH_MIN_CONFIRMATIONS: ${{ secrets.ZCASH_MIN_CONFIRMATIONS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:zcash-readonly
