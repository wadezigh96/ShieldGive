name: ShieldGive Mock E2E

on:
  push:
    branches:
      - "feat/cross-l1-zcash-solana-proof"
  workflow_dispatch:

jobs:
  mock-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run test:mock-e2e
